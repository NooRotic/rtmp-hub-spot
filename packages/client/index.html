    <title>RTMP Hub Spot - Client</title>
    <script>
      window.global = window;
      window.process = { 
        env: {}, 
        nextTick: (fn) => setTimeout(fn, 0),

      };

        window.Buffer = { isBuffer: () => false };
      }
